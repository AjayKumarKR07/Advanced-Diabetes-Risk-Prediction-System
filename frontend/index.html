<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Professional Clinical White UI immediate initialization (prevents flash of dark mode)
      try {
        const theme = localStorage.getItem('diabetes_ai_theme');
        if (!theme || theme === 'dark' || theme === 'system') {
          localStorage.setItem('diabetes_ai_theme', 'light');
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Diabetes Risk Predictor — CDC BRFSS 2015</title>
    <meta name="description" content="Research prototype: 3-class diabetes risk assessment using the CDC BRFSS 2015 dataset and group-aware machine learning." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
